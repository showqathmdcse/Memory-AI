# NATS Server Configuration for Agent-AI (macOS Docker compatible)

# TCP port for internal connections (mapped to 4223 externally)
port: 4222

# WebSocket configuration for VS Code
websocket {
  port: 9222
  no_tls: true
}

# JetStream for streaming
jetstream {
  store_dir: /data/jetstream
}

# HTTP monitoring
http_port: 8223
