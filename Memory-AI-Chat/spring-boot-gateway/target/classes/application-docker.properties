# Docker Profile Configuration

# Server Configuration
server.port=8081

# Static Resources
spring.webflux.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# Python Agent Service Configuration (Docker)
# Use container name and internal port (8000)
python.agent.url=http://python-agent-service:6080

# NATS Configuration (Docker)
nats.url=nats://nats-streaming:4222

# Logging
logging.level.root=INFO
logging.level.com.development=DEBUG
